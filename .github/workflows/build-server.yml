name: Build and test server

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'src/server/**'
      - 'global.json'
      - '.github/workflows/build-server.yml'
  push:
    branches:
      - 'main'
    paths:
      - 'src/server/**'
      - 'global.json'
      - '.github/workflows/build-server.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build --configuration Release
      - name: Check formatting
        run: |
          dotnet jb cleanupcode RobinTTY.PersonalFinanceDashboard.sln --profile="Built-in: Reformat Code" --no-build --verbosity=WARN
          git diff --ignore-cr-at-eol --exit-code -- .
      - name: Check for missing migrations
        run: >-
          dotnet ef migrations has-pending-model-changes --configuration Release --no-build
          --project RobinTTY.PersonalFinanceDashboard.Infrastructure
          --startup-project RobinTTY.PersonalFinanceDashboard.API
      - name: Run tests
        run: dotnet test --configuration Release --no-build
      - name: Report vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::warning title=Vulnerable packages::Some NuGet packages have known vulnerabilities, see the log of this step."
          fi
