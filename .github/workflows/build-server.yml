name: Build Server

on:
  push

jobs:

  Build-Library:
    name: Build library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Build
        run: dotnet build --configuration Release src/server/
      - name: Test
        run: dotnet test --configuration Release --no-build src/server/
