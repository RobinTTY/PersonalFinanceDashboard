"AuthenticationRequest related mutation resolvers."
type Mutation {
  "Create a new authentication request for an institution."
  createAuthenticationRequest(input: CreateAuthenticationRequestInput!): CreateAuthenticationRequestPayload! @cost(weight: "10")
  "Delete an existing authentication request."
  deleteAuthenticationRequest(input: DeleteAuthenticationRequestInput!): DeleteAuthenticationRequestPayload! @cost(weight: "10")
  """
  Synchronizes authentication request data with third-party data providers.
  
  
  **Returns:**
  A boolean value indicating whether the synchronization was successful.
  """
  synchronizeAuthenticationRequestData: SynchronizeAuthenticationRequestDataPayload! @cost(weight: "10")
  "Create a new banking account."
  createBankAccount("The banking account to create." input: CreateBankAccountInput!): CreateBankAccountPayload! @cost(weight: "10")
  "Update the name and description of an existing banking account."
  updateBankAccount("The banking account values to update." input: UpdateBankAccountInput!): UpdateBankAccountPayload! @cost(weight: "10")
  "Sets whether a bank account is included in analytics such as graphs and account views."
  setBankAccountIncludeInAnalytics(input: SetBankAccountIncludeInAnalyticsInput!): SetBankAccountIncludeInAnalyticsPayload! @cost(weight: "10")
  """
  Delete an existing bank account and its transactions. A synchronized account can only be deleted once its
  bank is disconnected or its access expired, since the synchronization would recreate it.
  """
  deleteBankAccount(input: DeleteBankAccountInput!): DeleteBankAccountPayload! @cost(weight: "10")
  """
  Synchronizes bank account data with third-party data providers.
  
  
  **Returns:**
  A boolean value indicating whether the synchronization was successful.
  """
  synchronizeBankAccountData: SynchronizeBankAccountDataPayload! @cost(weight: "10")
  "Create a new banking institution."
  createBankingInstitution("The banking institution to create." input: CreateBankingInstitutionInput!): CreateBankingInstitutionPayload! @cost(weight: "10")
  "Update an existing banking institution."
  updateBankingInstitution("The banking institution values to update." input: UpdateBankingInstitutionInput!): UpdateBankingInstitutionPayload! @cost(weight: "10")
  """
  Delete an existing banking institution that was created manually. Institutions of a data source are
  synchronized, which would recreate them.
  """
  deleteBankingInstitution(input: DeleteBankingInstitutionInput!): DeleteBankingInstitutionPayload! @cost(weight: "10")
  """
  Synchronizes banking institution data with third-party data providers.
  
  
  **Returns:**
  A boolean value indicating whether the synchronization was successful.
  """
  synchronizeBankingInstitutionData: SynchronizeBankingInstitutionDataPayload! @cost(weight: "10")
  "Create a new transaction."
  createTransaction("The transaction to create." input: CreateTransactionInput!): CreateTransactionPayload! @cost(weight: "10")
  "Update the category and notes of an existing transaction."
  updateTransaction("The transaction values to update." input: UpdateTransactionInput!): UpdateTransactionPayload! @cost(weight: "10")
  """
  Delete an existing transaction. A synchronized transaction can only be deleted once its account is no longer
  synchronized, since the synchronization would recreate it.
  """
  deleteTransaction(input: DeleteTransactionInput!): DeleteTransactionPayload! @cost(weight: "10")
  """
  Synchronizes transaction data with third-party data providers.
  
  
  **Returns:**
  A boolean value indicating whether the synchronization was successful.
  """
  synchronizeTransactionData: SynchronizeTransactionDataPayload! @cost(weight: "10")
}

