  startCursor: String
  "When paginating forwards, the cursor to continue."
  endCursor: String
}

"AuthenticationRequest related query resolvers."
type Query {
  "Look up authentication requests by their id."
  authenticationRequest("The id of the authentication request to retrieve." authenticationId: UUID! """
  Whether to retrieve the authentication request from its data provider first, e.g. while waiting for the user
  to grant access. Once access was granted, its accounts are retrieved too.
  """ refresh: Boolean! = false): AuthenticationRequest @cost(weight: "10")
  "Look up authentication requests."
  authenticationRequests: [AuthenticationRequest!]! @cost(weight: "10")
  "Look up an account by its id."
  bankAccount("The id of the account to lookup." accountId: UUID!): BankAccount @cost(weight: "10")
  "Look up accounts."
  bankAccounts("Returns the first _n_ elements from the list." first: Int "Returns the elements in the list that come after the specified cursor." after: String "Returns the last _n_ elements from the list." last: Int "Returns the elements in the list that come before the specified cursor." before: String where: BankAccountFilterInput @cost(weight: "10")): BankAccountsConnection @listSize(assumedSize: 50, slicingArguments: [ "first", "last" ], slicingArgumentDefaultValue: 10, sizedFields: [ "edges", "nodes" ], requireOneSlicingArgument: false) @cost(weight: "10")
  "Look up banking institutions by their id."
  bankingInstitution("The id of the banking institution to retrieve." institutionId: UUID!): BankingInstitution @cost(weight: "10")
  "Look up banking institutions."
  bankingInstitutions("Optional filter by country the institution operates in." countryCode: String "Returns the first _n_ elements from the list." first: Int "Returns the elements in the list that come after the specified cursor." after: String "Returns the last _n_ elements from the list." last: Int "Returns the elements in the list that come before the specified cursor." before: String): BankingInstitutionsConnection @listSize(assumedSize: 3000, slicingArguments: [ "first", "last" ], slicingArgumentDefaultValue: 10, sizedFields: [ "edges", "nodes" ], requireOneSlicingArgument: false) @cost(weight: "10")
  "Look up transactions."
  transactions("Returns the first _n_ elements from the list." first: Int "Returns the elements in the list that come after the specified cursor." after: String "Returns the last _n_ elements from the list." last: Int "Returns the elements in the list that come before the specified cursor." before: String): TransactionsConnection @listSize(assumedSize: 50, slicingArguments: [ "first", "last" ], slicingArgumentDefaultValue: 10, sizedFields: [ "edges", "nodes" ], requireOneSlicingArgument: false) @cost(weight: "10")
  "Look up transactions of an account."
  transactionsByAccountId("The id of the account to retrieve." accountId: UUID! "Returns the first _n_ elements from the list." first: Int "Returns the elements in the list that come after the specified cursor." after: String "Returns the last _n_ elements from the list." last: Int "Returns the elements in the list that come before the specified cursor." before: String): TransactionsByAccountIdConnection @listSize(assumedSize: 50, slicingArguments: [ "first", "last" ], slicingArgumentDefaultValue: 10, sizedFields: [ "edges", "nodes" ], requireOneSlicingArgument: false) @cost(weight: "10")
}

